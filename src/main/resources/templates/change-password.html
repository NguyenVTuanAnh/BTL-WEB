<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <link rel="stylesheet" href="https://unpkg.com/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>


<div th:replace="~{fragments/header :: header}"></div>

<!-- Password Reset 1 - Bootstrap Brain Component -->
<div class="bg-light py-3 py-md-5">
    <div class="container">
        <div class="row justify-content-md-center">
            <div class="col-12 col-md-11 col-lg-8 col-xl-7 col-xxl-6">
                <div class="bg-white p-4 p-md-5 rounded shadow-sm">
                    <div class="row gy-3 mb-5">
                        <div class="col-12">
                            <div class="text-center">
                                <a href="#!">
                                    <img src="/images/logo.svg" alt="BootstrapBrain Logo" width="175" height="57">
                                </a>
                            </div>
                        </div>
                        <div class="col-12">
                            <h2 class="fs-6 fw-normal text-center text-secondary m-0 px-md-5">Provide the email address associated with your account to recover your password.</h2>
                        </div>
                    </div>
                    <form th:action="@{/templates/email}" method="post" >
                        <div class="row gy-3 gy-md-4 overflow-hidden">

                            <div class="col-12">
                                <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                                <div class="input-group">
                                         <span class="input-group-text">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-lock" viewBox="0 0 16 16">
                                                <path d="M3 8V6a5 5 0 0 1 10 0v2h1a1 1 0 0 1 1 1v5a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V9a1 1 0 0 1 1-1h1Zm2 0h6V6a3 3 0 1 0-6 0v2Z"/>
                                            </svg>
                                        </span>
                                    <input type="text" class="form-control" name="email" id="email" required>
                                </div>
                            </div>

                            <div class="col-12">
                                <label for="npassword" class="form-label">New Password <span class="text-danger">*</span></label>
                                <div class="input-group">
                                         <span class="input-group-text">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-lock" viewBox="0 0 16 16">
                                                <path d="M3 8V6a5 5 0 0 1 10 0v2h1a1 1 0 0 1 1 1v5a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V9a1 1 0 0 1 1-1h1Zm2 0h6V6a3 3 0 1 0-6 0v2Z"/>
                                            </svg>
                                        </span>
                                    <input type="password" class="form-control" name="npassword" id="npassword" required>
                                </div>
                            </div>


                            <div class="col-12">
                                <label for="cpassword" class="form-label">Confirm Password <span class="text-danger">*</span></label>
                                <div class="input-group">
                                         <span class="input-group-text">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-lock" viewBox="0 0 16 16">
                                                <path d="M3 8V6a5 5 0 0 1 10 0v2h1a1 1 0 0 1 1 1v5a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V9a1 1 0 0 1 1-1h1Zm2 0h6V6a3 3 0 1 0-6 0v2Z"/>
                                            </svg>
                                        </span>
                                    <input type="password" class="form-control" name="cpassword" id="cpassword" required>
                                </div>
                            </div>

                            <div class="col-12">
                                <label for="code" class="form-label">Code <span class="text-danger">*</span></label>
                                <div class="input-group">
                                         <span class="input-group-text">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-lock" viewBox="0 0 16 16">
                                                <path d="M3 8V6a5 5 0 0 1 10 0v2h1a1 1 0 0 1 1 1v5a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V9a1 1 0 0 1 1-1h1Zm2 0h6V6a3 3 0 1 0-6 0v2Z"/>
                                            </svg>
                                        </span>
                                    <input type="text" class="form-control" name="code" id="code" required>
                                </div>
                            </div>

                            <div class="col-12">
                                <div class="d-grid">
                                    <button class="btn btn-primary btn-lg" type="submit">Reset Password</button>
                                </div>
                            </div>
                        </div>
                    </form>
                    <div class="row">
                        <div class="col-12">
                            <hr class="mt-5 mb-4 border-secondary-subtle">
                            <div sec:authorize="!isAuthenticated()" class="d-flex gap-4 justify-content-center">
                                <a th:href="@{/login}" class="link-secondary text-decoration-none">Log In</a>
                                <a th:href="@{/register}" class="link-secondary text-decoration-none">Register</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
