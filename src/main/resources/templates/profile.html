<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <title>Organic - Grocery Store HTML Website Template</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="author" content="">
    <meta name="keywords" content="">
    <meta name="description" content="">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/vendor.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Open+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

</head>
<body>



<div th:replace="~{fragments/header :: header}"></div>

<!-- Modal upload file-->
<div class="modal fade" id="uploadModal" tabindex="-1" aria-labelledby="uploadModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="uploadModalLabel">Upload Avatar</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <!-- Hiển thị ảnh xem trước -->
                <div class="text-center" style="margin-bottom: 40px; margin-top: 20px">

                    <img id="preview" src="https://via.placeholder.com/150"
                         class="rounded-circle img-thumbnail" style="width: 150px; cursor: pointer; border-radius: 50%; aspect-ratio: 1/1">

                </div>

                <form th:action="@{/upload}" method="post" enctype="multipart/form-data">
                    <input type="file" id="fileInput" name="file" accept="image/*" class="form-control mt-3" style="display: none;">

                    <div class="text-center mt-2">
                        <input type="file" name="image" class="form-control" id="customFile" />
                    </div>

                    <div class="mt-3">
                        <button type="submit" class="btn btn-success w-100" onclick="checkFileUpload(event)">Upload</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<!--end modal upload file-->



<section style="background-color: #eee;">
    <div class="container py-5">
    <form th:action="@{/user}" method="post" th:object="${user}">
        <div class="row">
            <div class="col-lg-4">
                <div class="card mb-4">
                    <div class="card-body text-center">

                        <div th:if="${user.urlImage}">
                            <img th:src="@{${user.urlImage}}"
                                 style="width: 150px; height: 150px; object-fit: cover; border-radius: 50%; cursor: pointer; aspect-ratio: 1/1;"
                                 alt="avatar" class="rounded-circle img-fluid"
                                 ata-bs-toggle="modal" data-bs-target="#uploadModal">


                        </div>

                        <div th:unless="${user.urlImage}">
                            <img src="https://preview.redd.it/how-would-your-avatar-win-or-lose-against-gojo-v0-8pe5abo1hgtd1.jpeg?width=640&crop=smart&auto=webp&s=a08ff3a894b6f73ea7596acc11aaa7a7608235ec"
                                 alt="avatar" class="rounded-circle img-fluid" style="width: 150px; cursor: pointer;"
                                 data-bs-toggle="modal" data-bs-target="#uploadModal">
                        </div>

                        <h5 class="my-3"><span th:text="${user.fullname}"></span></h5>
                        <p class="text-muted mb-1"><span th:text="${user.email}"></span></p>
                        <div class="d-flex justify-content-center mb-2">
                            <button  type="submit" data-mdb-button-init data-mdb-ripple-init class="btn btn-primary">Apply</button>
                            <button  type="button" data-mdb-button-init data-mdb-ripple-init class="btn btn-outline-danger ms-1" onclick="window.location.href='/home'">
                                Cancel</button>
                        </div>
                    </div>
                </div>
                <div class="card mb-4 mb-lg-0">
                    <div class="card-body p-0">
                        <ul class="list-group list-group-flush rounded-3">
                            <li class="list-group-item d-flex justify-content-between align-items-center p-3">
                                <i class="fas fa-globe fa-lg text-warning"></i>
                                <p class="mb-0">https://mdbootstrap.com</p>
                            </li>
                            <li class="list-group-item d-flex justify-content-between align-items-center p-3">
                                <i class="fab fa-github fa-lg text-body"></i>
                                <p class="mb-0">mdbootstrap</p>
                            </li>

                        </ul>
                    </div>
                </div>
            </div>
            <div class="col-lg-8">
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-sm-3">
                                <p class="mb-0">Full Name</p>
                            </div>

                            <div class="col-sm-9">
                                <p class="text-muted mb-0">
                                    <input type="text" class="form-control" th:field="*{fullname}" placeholder="FullName">
                                    </p>
                            </div>
                        </div>
                        <hr>
                        <div class="row">
                            <div class="col-sm-3">
                                <p class="mb-0">Email</p>
                            </div>
                            <div class="col-sm-9">
                                <p class="text-muted mb-0"><input type="text" class="form-control" th:field="*{email}" placeholder="Email" readonly></p>
                            </div>
                        </div>
                        <hr>
                        <div class="row">
                            <div class="col-sm-3">
                                <p class="mb-0">Phone</p>
                            </div>
                            <div class="col-sm-9">
                                <p class="text-muted mb-0"><input type="text" class="form-control" th:field="*{phone}" placeholder="Phone"></p>
                            </div>
                        </div>
                        <hr>
                        <div class="row">
                            <div class="col-sm-3">
                                <p class="mb-0">Address</p>
                            </div>
                            <div class="col-sm-9">
                                <p class="text-muted mb-0"><input type="text" class="form-control" th:field="*{address}" placeholder="Address"></p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-12">
                        <div class="card mb-4 mb-md-0">
                            <div class="card-body">
                                <p class="mb-4"><span class="text-primary font-italic me-1">Purchase History</span>
                                </p>
                                <p class="mb-1" style="font-size: .77rem;">Web Design</p>
                                <div class="progress rounded" style="height: 5px;">
                                    <div class="progress-bar" role="progressbar" style="width: 80%" aria-valuenow="80"
                                         aria-valuemin="0" aria-valuemax="100"></div>
                                </div>
                                <p class="mt-4 mb-1" style="font-size: .77rem;">Website Markup</p>
                                <div class="progress rounded" style="height: 5px;">
                                    <div class="progress-bar" role="progressbar" style="width: 72%" aria-valuenow="72"
                                         aria-valuemin="0" aria-valuemax="100"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </form>

    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
